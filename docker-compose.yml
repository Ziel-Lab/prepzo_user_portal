version: '3.12'

services:
  app:
    build: .
    ports:
      - "5000:5000"  
                     
    volumes:
      - .:/app       
      - model_cache:/root/.cache  # Cache for downloaded models
                     
    env_file:
      - .env        
    environment:
      - FLASK_ENV=development 
      - OTHER_VARIABLE=value

volumes:
  model_cache:
